# Render.com Blueprint — Xroot IT Telegram bot
# https://render.com/docs/blueprint-spec
#
# Bot long-polling rejimida ishlaydi + kichik health HTTP server bor,
# shuning uchun bepul "web" turidagi servis sifatida deploy qilinadi.
#
# Bot o'zini-o'zi ping qiladi (RENDER_EXTERNAL_URL orqali), shuning uchun
# bepul servis uxlab qolmaydi va 24/7 ishlaydi — tashqi pinger kerak emas.

services:
  - type: web
    name: xroot-agency-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false          # Render dashboard'da qo'lda kiritiladi (maxfiy)
      - key: ADMIN_TELEGRAM_ID
        sync: false          # Render dashboard'da qo'lda kiritiladi
